<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Zohie Lopez — Fashion Merchandising student at TCU. Styling, creative direction, marketing, and product portfolio.">
<meta property="og:title" content="Zohie Lopez Portfolio">
<meta property="og:description" content="Styling, creative direction, marketing, and product work by Zohie Lopez.">
<meta property="og:image" content="images/city-boots-04.jpg">
<title>Zohie Lopez Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Hanken+Grotesk:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: fashion-editorial magazine. Asymmetric 12-col grids, image-led stories, type carries hierarchy, no cards. Single light look by design. */
:root{
  --ivory:#F6F2EA; --paper:#ECE5D8; --ink:#16130F; --char:#3B3630; --stone:#7E766A; --line:#D8CFBF; --accent:#8A5646;
  --t1:#E4DBCB; --t2:#D5C9B5; --t3:#C1B39C; --t4:#2C2824;
  --display:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;
  --body:'Hanken Grotesk','Helvetica Neue',Arial,sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,monospace;
  --gut:clamp(16px,4.5vw,64px);
  color-scheme:light;
}
html{scroll-behavior:smooth}
body{background:var(--ivory);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:inherit}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:3px}
.wrap{padding-inline:var(--gut);max-width:1440px;margin-inline:auto}
.sec{padding-block:clamp(56px,9vw,128px)}
.sec.tight{padding-block:clamp(36px,5vw,64px)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--stone);margin:0 0 18px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:clamp(2rem,4.6vw,3.6rem);line-height:1.05}
h3{font-size:clamp(1.35rem,2.2vw,1.75rem);line-height:1.15}
em{font-style:italic}
p{margin:0;max-width:62ch}
.lede{font-family:var(--display);font-size:clamp(1.3rem,2.3vw,1.85rem);line-height:1.35;max-width:34ch;text-wrap:pretty}
.body{color:var(--char)}
.body p+p{margin-top:1em}
.ph{color:var(--stone);font-style:italic;font-family:var(--body)}
.lede .ph{font-family:var(--display)}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--ivory) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;justify-content:space-between;align-items:center;min-height:62px;gap:16px}
.brand{font-family:var(--display);font-size:clamp(17px,2vw,21px);text-decoration:none;white-space:nowrap}
.brand em{color:var(--accent)}
.nav ul{display:flex;gap:clamp(14px,3vw,40px);list-style:none;margin:0;padding:0}
.nl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--char);text-decoration:none;padding-block:6px;border-bottom:1px solid transparent;transition:border-color .3s}
.nl:hover{border-color:var(--line)}
.nl[aria-current="page"]{border-color:var(--ink);color:var(--ink)}

/* image frames */
.img{position:relative;margin:0;overflow:hidden;max-width:100%;width:100%;display:flex;align-items:flex-end;background:var(--t2)}
.img::before{content:"";position:absolute;inset:0;background:inherit;transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.img::after{content:"";position:absolute;inset:10px;border:1px solid color-mix(in srgb,var(--ink) 9%,transparent);pointer-events:none}
.img span{position:relative;z-index:1;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--char);padding:18px 20px;opacity:.8;line-height:1.5}
.img video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
a:hover .img::before,.img:hover::before,a:hover .img img,.img:hover img{transform:scale(1.035)}
.t-a{background:var(--t1)}.t-b{background:var(--t2)}.t-c{background:var(--t3)}.t-d{background:var(--t4)}
.t-d span{color:var(--t2)} .t-d::after{border-color:color-mix(in srgb,var(--ivory) 14%,transparent)}
figcaption,.cap{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--stone);margin-top:12px}

/* page motion */
.page{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page{animation:none}.img::before,.img img{transition:none}html{scroll-behavior:auto}}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:12px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--ink);padding-block:6px;background:none;border-top:0;border-left:0;border-right:0;cursor:pointer}
.btn::after{content:"→";transition:transform .35s}
.btn:hover::after{transform:translateX(5px)}

/* home */
.hero{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(20px,3vw,40px);padding-block:clamp(40px,7vw,96px) clamp(48px,7vw,96px);align-items:end}
.hero-text{grid-column:1/8;min-width:0}
.hero .img{grid-column:8/13}
.name{font-size:clamp(4rem,13.5vw,12.5rem);line-height:.86;letter-spacing:-.035em;margin-bottom:clamp(24px,3vw,40px)}
.name em{display:block;padding-left:.55em;color:var(--accent)}
.desc{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--char);margin-bottom:22px}
.hero .intro{font-size:1.06rem;color:var(--char);max-width:44ch;margin-bottom:28px}
.credits{border-block:1px solid var(--line);overflow:hidden}
.credits ul{display:flex;flex-wrap:wrap;gap:10px 36px;list-style:none;margin:0;padding-block:18px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--char)}
.credits li{display:flex;gap:36px;white-space:nowrap}
.credits li:not(:last-child)::after{content:"/";color:var(--line)}
.sel-head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:clamp(32px,5vw,64px)}
.sel{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(20px,3vw,40px) clamp(16px,2.5vw,32px)}
.sel .s1{grid-column:1/8}.sel .s2{grid-column:9/13;margin-top:22%}.sel .s3{grid-column:2/7}.sel .s4{grid-column:8/13;margin-top:-12%}
.tile{text-decoration:none;display:block;min-width:0}
.tile-meta{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.tile-meta h3{font-size:clamp(1.25rem,2vw,1.6rem)}
.tile-meta span{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--stone);text-align:right}
.skills{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(28px,5vw,80px);border-top:1px solid var(--line)}
.skill-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.skill-cols ul{list-style:none;margin:0;padding:0}
.skill-cols li{font-family:var(--display);font-size:1.25rem;padding-block:9px;border-bottom:1px solid var(--line)}
.cta{background:var(--ink);color:var(--ivory)}
.cta .wrap{display:grid;gap:28px}
.cta h2{font-size:clamp(2.8rem,9vw,8rem);line-height:.95;letter-spacing:-.03em}
.cta h2 em{color:#C79E8E}
.cta .eyebrow{color:#A49A8B}
.cta .btn{color:var(--ivory);border-color:var(--ivory)}
.cta-row{display:flex;gap:28px 48px;flex-wrap:wrap;align-items:center}
.cta-mail{font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:#D9D0C2;user-select:all;word-break:break-all}

/* work index */
.page-head{padding-block:clamp(40px,7vw,96px) clamp(24px,4vw,48px);display:grid;gap:22px}
.page-head h1{font-size:clamp(3.4rem,10vw,9rem);line-height:.9;letter-spacing:-.035em}
.page-head h1 sup{font-family:var(--mono);font-size:12px;letter-spacing:.1em;vertical-align:top;margin-left:10px;color:var(--stone)}
.filters{display:flex;flex-wrap:wrap;gap:10px 26px;border-block:1px solid var(--line);padding-block:16px}
.filters button{background:none;border:0;padding:4px 0;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);border-bottom:1px solid transparent}
.filters button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.idx{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(36px,5vw,72px) clamp(16px,2.5vw,32px);padding-block:clamp(40px,6vw,80px) clamp(64px,9vw,128px)}
.idx .p0{grid-column:1/8}.idx .p1{grid-column:9/13;margin-top:18%}.idx .p2{grid-column:1/6}.idx .p3{grid-column:7/13}.idx .p4{grid-column:2/8}.idx .p5{grid-column:9/13;margin-top:10%}

/* case studies */
.case-head{padding-block:clamp(40px,7vw,96px) clamp(32px,4vw,56px)}
.case-title{font-size:clamp(3rem,9vw,8rem);line-height:.92;letter-spacing:-.035em;margin-bottom:clamp(28px,4vw,52px)}
.case-title em{display:block;font-size:.42em;letter-spacing:-.01em;color:var(--accent);margin-top:.35em}
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;border-top:1px solid var(--ink);padding-top:16px;margin:0}
.meta dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);margin-bottom:6px}
.meta dd{margin:0;font-size:.98rem}
.split{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:clamp(20px,4vw,64px);border-top:1px solid var(--line)}
.split>div{min-width:0}
.role{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:clamp(20px,4vw,56px)}
.role li{padding-block:14px;border-bottom:1px solid var(--line);font-size:1.02rem}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:24px;counter-reset:s}
.steps li{counter-increment:s;border-top:1px solid var(--ink);padding-top:14px}
.steps li::before{content:counter(s,decimal-leading-zero);display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--accent);margin-bottom:10px}
.steps b{display:block;font-family:var(--display);font-weight:400;font-size:1.25rem;line-height:1.2;margin-bottom:6px}
.steps p{font-size:.92rem;color:var(--char)}
.asym{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(28px,4vw,56px) clamp(16px,2.5vw,32px)}
.asym .a1{grid-column:1/8}.asym .a2{grid-column:9/13;margin-top:26%}.asym .a3{grid-column:2/6}.asym .a4{grid-column:7/13;margin-top:-8%}.asym .a5{grid-column:1/13}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2vw,24px)}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,2vw,24px)}
.quad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,2vw,24px)}
.looks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 clamp(20px,4vw,56px);margin:0}
.looks div{display:grid;grid-template-columns:90px minmax(0,1fr);gap:16px;padding-block:16px;border-bottom:1px solid var(--line)}
.looks dt{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);padding-top:3px}
.looks dd{margin:0}
.bignum{font-family:var(--display);font-size:clamp(6rem,20vw,16rem);line-height:.8;letter-spacing:-.05em;color:var(--accent)}
.statband{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,6fr);gap:clamp(24px,4vw,64px);align-items:end}
.next{display:block;text-decoration:none;border-top:1px solid var(--ink);padding-block:clamp(36px,6vw,72px)}
.next h2{font-size:clamp(2.6rem,8vw,6.5rem);letter-spacing:-.03em;transition:color .3s}
.next:hover h2{color:var(--accent)}

/* tables */
.tbl-wrap{overflow-x:auto;border-top:1px solid var(--ink)}
table{width:100%;border-collapse:collapse;min-width:560px;font-variant-numeric:tabular-nums}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);font-weight:400;text-align:left;padding:14px 16px 14px 0;border-bottom:1px solid var(--line)}
td{padding:16px 16px 16px 0;border-bottom:1px solid var(--line);vertical-align:top;font-size:.95rem}
td:first-child{font-family:var(--mono);font-size:12px;color:var(--accent);white-space:nowrap}

/* strategy */
.chapters{display:flex;flex-wrap:wrap;gap:8px 22px;padding-block:16px;border-bottom:1px solid var(--line)}
.chapters button{background:none;border:0;padding:2px 0;cursor:pointer;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--char)}
.chapters button:hover{color:var(--accent)}
.swot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--ink)}
.swot div{padding:22px 22px 26px 0;border-bottom:1px solid var(--line);min-height:150px}
.swot div:nth-child(odd){border-right:1px solid var(--line)}
.swot div:nth-child(even){padding-left:22px}
.swot h3{font-size:1.5rem;margin-bottom:10px}
.insights{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,40px)}
.insights div{border-top:1px solid var(--ink);padding-top:16px}
.insights q{display:block;font-family:var(--display);font-size:1.35rem;line-height:1.3;quotes:none;margin-bottom:12px}
.recs{list-style:none;margin:0;padding:0;counter-reset:r}
.recs li{counter-increment:r;display:grid;grid-template-columns:80px minmax(0,1fr);gap:20px;padding-block:22px;border-bottom:1px solid var(--line)}
.recs li::before{content:counter(r,decimal-leading-zero);font-family:var(--display);font-size:2.4rem;line-height:1;color:var(--accent)}
.tagline{font-family:var(--display);font-style:italic;font-size:clamp(2.4rem,6.5vw,5.5rem);line-height:1;letter-spacing:-.02em;color:var(--stone);max-width:16ch}

/* data */
.profile{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:clamp(24px,4vw,64px);align-items:center}
.handle{font-family:var(--display);font-size:clamp(2.2rem,5vw,4rem);line-height:1;margin-bottom:22px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--ink)}
.stats div{padding:20px 16px 20px 0;border-bottom:1px solid var(--line)}
.stats b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(2rem,4vw,3.2rem);line-height:1;color:var(--stone);font-variant-numeric:tabular-nums}
.stats span{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--stone)}
.bars{display:grid;gap:14px;max-width:760px}
.bar{display:grid;grid-template-columns:80px minmax(0,1fr) 70px;gap:16px;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--char)}
.bar i{display:block;height:10px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 10px)}
.bar em{color:var(--stone);text-align:right}

/* palette */
.palette{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(8px,1.5vw,16px)}
.chip{aspect-ratio:3/4;display:flex;align-items:flex-end;padding:12px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.chips{display:flex;gap:6px;margin-top:16px}
.chips i{width:28px;height:28px;display:block;border:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}
.deliv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2.5vw,32px)}
.deliv div{border-top:1px solid var(--ink);padding-top:14px}
.deliv b{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:10px}
.line{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(20px,2.5vw,32px) clamp(12px,2vw,24px)}
.line p{font-size:.88rem;margin-top:10px;color:var(--char)}
.line p b{font-weight:500;color:var(--ink);display:block}

/* graphic design */
.prog{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:clamp(24px,4vw,64px);border-top:1px solid var(--ink);padding-top:clamp(24px,3vw,40px)}
.prog h2{font-size:clamp(2.4rem,5vw,4.2rem);line-height:1}
.prog h2 small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.prog .tags{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:18px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--char)}
.prog-imgs{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:clamp(12px,2vw,20px)}
.prog-imgs .full{grid-row:span 2}

/* mood boards */
.board{display:grid;grid-template-columns:minmax(0,9fr) minmax(0,3fr);gap:clamp(20px,3vw,48px);align-items:end}
.board.flip{grid-template-columns:minmax(0,3fr) minmax(0,9fr)}
.board.flip .board-text{order:-1}
.board-text h3{font-size:clamp(1.8rem,3vw,2.6rem);margin-bottom:12px}
.board-text dl{margin:18px 0 0;display:grid;gap:12px}
.board-text dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--stone)}
.board-text dd{margin:2px 0 0}

/* about / contact */
.about{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(28px,5vw,80px);align-items:start}
.cv{display:grid;gap:clamp(36px,5vw,56px)}
.cv-row{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:20px;border-top:1px solid var(--line);padding-top:16px}
.cv-row ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.cv-row li b{font-weight:500}
.contact-big{font-size:clamp(3.2rem,11vw,10rem);line-height:.9;letter-spacing:-.04em}
.contact-big em{color:var(--accent)}
.clist{border-top:1px solid var(--ink);margin-top:clamp(40px,6vw,72px)}
.clist div{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,7fr) auto;gap:20px;align-items:center;padding-block:22px;border-bottom:1px solid var(--line)}
.clist dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--stone)}
.clist dd{margin:0;font-family:var(--display);font-size:clamp(1.2rem,2.6vw,2rem);min-width:0;overflow-wrap:anywhere}
.copy{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;background:none;border:1px solid var(--line);padding:8px 12px;cursor:pointer;color:var(--char)}
.copy:hover{border-color:var(--ink)}

footer{border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-block:28px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--stone)}

@media (max-width:820px){
  .hero-text,.hero .img{grid-column:1/-1}
  .hero .img{max-width:520px}
  .sel .s1,.sel .s2,.sel .s3,.sel .s4,.idx>*,.asym>*{grid-column:1/-1!important;margin-top:0!important}
  .skills,.split,.profile,.about,.statband,.prog,.board,.board.flip,.cv-row{grid-template-columns:minmax(0,1fr)}
  .board.flip .board-text{order:0}
  .meta,.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .role,.looks,.insights,.deliv,.swot{grid-template-columns:minmax(0,1fr)}

/* ---------- router ---------- */
const app = document.getElementById('app');
function render(){
  const key = (location.hash.slice(1) || 'home');
  const fn = PAGES[key] || PAGES.home;
  app.innerHTML = `<div class="page">${fn()}</div>`;
  const section = ['home','about','contact'].includes(key) ? key : 'work';
  document.querySelectorAll('[data-nav]').forEach(a => {
    if (a.dataset.nav === section) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
  });
  window.scrollTo({top:0});
}
app.addEventListener('click', e => {
  const f = e.target.closest('[data-filter]');
  if (f){ const y = window.scrollY; app.innerHTML = `<div class="page">${PAGES.work(f.dataset.filter)}</div>`; window.scrollTo({top:y}); return; }
  const s = e.target.closest('[data-scroll]');
  if (s){ document.getElementById(s.dataset.scroll)?.scrollIntoView({behavior:'smooth'}); return; }
  if (e.target.id === 'copy-mail'){
    const b = e.target;
    const done = () => { b.textContent = 'Copied'; setTimeout(()=>b.textContent='Copy',1600); };
    try { navigator.clipboard.writeText(EMAIL).then(done, () => selectMail()); } catch(_) { selectMail(); }
  }
});
function selectMail(){ const r=document.createRange(); r.selectNodeContents(document.getElementById('mail')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
window.addEventListener('hashchange', render);
render();
</script>
